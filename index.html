<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Schoolvolleybal WK - Reis naar China</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Schoolvolleybal WK - Reis naar China</h1>
            <p class="subtitle">Volg onze voortgang richting het wereldkampioenschap!</p>
        </header>

        <main>
            <div class="visualization-container" id="vizContainer">
                <svg id="flightMap" viewBox="0 0 1000 400" preserveAspectRatio="xMidYMid meet">
                    <!-- Background rectangle -->
                    <rect x="0" y="0" width="1000" height="400" fill="#E8F4F8" opacity="0.5"/>

                    <!-- World map embedded - positioned to show Europe to China -->
                    <image href="world.svg" x="-350" y="-50" width="1700" height="500" opacity="1"
                           preserveAspectRatio="xMidYMid meet" class="world-map"/>

                    <!-- Flight path - great circle route (follows Earth's curvature) -->
                    <!-- Route arcs northward through Russia, as is realistic for NL->China flights -->
                    <path id="flightPath" class="flight-path"
                          d="M 100 250 Q 200 120, 400 100 T 700 140 T 900 260"
                          fill="none" stroke-width="4" stroke-dasharray="8,6"/>

                    <!-- Start location -->
                    <g id="startLocation">
                        <circle cx="100" cy="250" r="10" fill="#4CAF50" stroke="white" stroke-width="3"/>
                        <text x="100" y="290" class="location-label">Nederland 🇳🇱</text>
                    </g>

                    <!-- End location -->
                    <g id="endLocation">
                        <circle cx="900" cy="260" r="10" fill="#FF6B6B" stroke="white" stroke-width="3"/>
                        <text x="900" y="300" class="location-label">China 🇨🇳</text>
                    </g>


                    <!-- Plane (starts at origin, will be positioned by JS) -->
                    <g id="plane" class="plane" transform="translate(100, 250)">
                        <path d="M 0 -10 L -14 5 L -10 7 L -12 14 L -7 14 L 0 10 L 7 14 L 12 14 L 10 7 L 14 5 Z"
                              fill="#FF6B6B" stroke="white" stroke-width="1.5"/>
                        <circle cx="0" cy="0" r="4" fill="#FFD54F" stroke="white" stroke-width="1"/>
                    </g>

                    <!-- Current country indicator -->
                    <text id="currentCountry" x="500" y="370" class="current-country"></text>
                </svg>
            </div>

            <div class="info-panel">
                <div class="stat-card primary">
                    <div class="stat-value" id="amountRaised">€ 0</div>
                    <div class="stat-label">van € 41.500 opgehaald</div>
                </div>

                <div class="stat-card">
                    <div class="stat-value" id="percentage">0%</div>
                    <div class="stat-label">gefinancierd</div>
                </div>

                <div class="stat-card">
                    <div class="stat-value" id="kmTraveled">0 km</div>
                    <div class="stat-label">van 8.000 km afgelegd</div>
                </div>
            </div>
        </main>

        <footer>
            <p>Laatste update: <span id="lastUpdate">-</span></p>
        </footer>
    </div>

    <script src="js/data.js"></script>
    <script src="js/animation.js"></script>
</body>
</html>
