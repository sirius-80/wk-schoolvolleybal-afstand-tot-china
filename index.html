<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Schoolvolleybal WK - Reis naar China</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Schoolvolleybal WK - Reis naar China</h1>
            <p class="subtitle">Volg onze voortgang richting het wereldkampioenschap!</p>
        </header>

        <main>
            <div class="visualization-container" id="vizContainer">
                <svg id="flightMap" viewBox="0 0 1000 400" preserveAspectRatio="xMidYMid meet">
                    <!-- Background rectangle -->
                    <rect x="0" y="0" width="1000" height="400" fill="#E8F4F8" opacity="0.5"/>

                    <!-- World map with correct viewBox to show Netherlands to China -->
                    <!-- Nested SVG with viewBox targeting the NL-China region in world.svg -->
                    <svg x="0" y="0" width="1000" height="400" viewBox="450 225 365 175" preserveAspectRatio="xMidYMid slice">
                        <image href="world.svg" x="0" y="0" width="1009.6727" height="665.96301" class="world-map"/>

                        <!-- Flight path in world.svg coordinates - great circle route -->
                        <!-- Route arcs northward through Russia -->
                        <path id="flightPath" class="flight-path"
                              d="M 470 240 Q 550 230, 650 250 Q 730 270, 770 350"
                              fill="none" stroke-width="2" stroke-dasharray="6,4"/>

                        <!-- Start location - Netherlands -->
                        <g id="startLocation">
                            <circle cx="470" cy="240" r="5" fill="#4CAF50" stroke="white" stroke-width="2"/>
                            <text x="470" y="255" class="location-label" font-size="10">Nederland 🇳🇱</text>
                        </g>

                        <!-- End location - China -->
                        <g id="endLocation">
                            <circle cx="770" cy="350" r="5" fill="#FF6B6B" stroke="white" stroke-width="2"/>
                            <text x="770" y="365" class="location-label" font-size="10">China 🇨🇳</text>
                        </g>

                        <!-- Plane (starts at Netherlands) -->
                        <g id="plane" class="plane" transform="translate(470, 240)">
                            <path d="M 0 -5 L -7 2.5 L -5 3.5 L -6 7 L -3.5 7 L 0 5 L 3.5 7 L 6 7 L 5 3.5 L 7 2.5 Z"
                                  fill="#FF6B6B" stroke="white" stroke-width="0.8"/>
                            <circle cx="0" cy="0" r="2" fill="#FFD54F" stroke="white" stroke-width="0.5"/>
                        </g>

                        <!-- Current country indicator -->
                        <text id="currentCountry" x="620" y="390" class="current-country" font-size="12"></text>
                    </svg>
                </svg>
            </div>

            <div class="info-panel">
                <div class="stat-card primary">
                    <div class="stat-value" id="amountRaised">€ 0</div>
                    <div class="stat-label">van € 41.500 opgehaald</div>
                </div>

                <div class="stat-card">
                    <div class="stat-value" id="percentage">0%</div>
                    <div class="stat-label">gefinancierd</div>
                </div>

                <div class="stat-card">
                    <div class="stat-value" id="kmTraveled">0 km</div>
                    <div class="stat-label">van 8.000 km afgelegd</div>
                </div>
            </div>
        </main>

        <footer>
            <p>Laatste update: <span id="lastUpdate">-</span></p>
        </footer>
    </div>

    <script src="js/data.js"></script>
    <script src="js/animation.js"></script>
</body>
</html>
